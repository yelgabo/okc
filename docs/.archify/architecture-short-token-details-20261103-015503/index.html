<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incumbent details: 1 and 8 tokens</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #161616; color: #ededed; font: 15px/1.5 Arial, Helvetica, sans-serif; }
header { padding: 18px 24px 12px; border-bottom: 1px solid #444; }
h1 { font-size: 21px; margin: 0 0 6px; font-weight: 600; }
p { margin: 0 0 12px; color: #bbb; max-width: 900px; }
nav { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
button, a { color: #ddd; font: inherit; }
button { border: 1px solid #555; background: #222; padding: 6px 12px; border-radius: 3px; cursor: pointer; }
button[aria-pressed="true"] { background: #eee; color: #161616; border-color: #eee; }
a { text-underline-offset: 3px; }
#open { margin-left: 8px; }
iframe { border: 0; width: 100%; height: calc(100vh - 185px); min-height: 650px; display: block; background: #161616; }
#context { margin: 10px 0 0; font-size: 13px; }
button:focus-visible, a:focus-visible { outline: 2px solid #ddd; outline-offset: 3px; }
@media(max-width:650px) { header { padding: 14px; } iframe { height: 900px; } #open { margin-left: 0; } }
</style>
</head>
<body>
<header>
<h1>Incumbent details: 1 and 8 tokens</h1>
<p>The public607 decoder layer. T1 uses Tiny; T8 uses Tiny2. Click a node for pinned source. Box size carries no timing meaning.</p>
<nav aria-label="Choose an architecture detail">
<button type="button" data-file="tiny-hardware.html" aria-pressed="true">Tiny hardware</button>
<button type="button" data-file="tiny-phases.html" aria-pressed="false">A / B handoff</button>
<button type="button" data-file="attention-detail.html" aria-pressed="false">Attention</button>
<button type="button" data-file="projection-detail.html" aria-pressed="false">Projections</button>
<button type="button" data-file="post-attention-detail.html" aria-pressed="false">After attention</button>
<a id="open" href="tiny-hardware.html" target="_blank" rel="noopener">Open full diagram</a>
</nav>
<p id="context">288 threads per CTA. Eight compute warps, one helper, a packed-weight ring and register-held activations.</p>
</header>
<iframe id="diagram" src="tiny-hardware.html" title="Tiny hardware diagram"></iframe>
<script>
const descriptions = {
 'tiny-hardware.html':'288 threads per CTA. Eight compute warps, one helper, a packed-weight ring and register-held activations.',
 'tiny-phases.html':'One persistent MoE launch. Per-job A readiness gates B; a grid barrier follows B before the final RMS and route sum.',
 'attention-detail.html':'Decode1 is B1/L1. Verify1 is B1/L8. Both use a fused attention launch, with different tensor-core arithmetic.',
 'projection-detail.html':'Lossless BF16 packing, TMA staging, tensor-core work and exact escape corrections for QKV, O and sliced unpool.',
 'post-attention-detail.html':'Seven launches after attention. Fused pooler/router is enabled; the larger O/boundary fusion is disabled.'
};
const diagram = document.getElementById('diagram');
diagram.addEventListener('load', () => {
 diagram.style.height = Math.max(650, diagram.contentDocument.documentElement.scrollHeight) + 'px';
});
for (const button of document.querySelectorAll('button[data-file]')) {
 button.addEventListener('click', () => {
  for (const other of document.querySelectorAll('button[data-file]')) other.setAttribute('aria-pressed', String(other === button));
  const file = button.dataset.file;
  document.getElementById('diagram').src = file;
  document.getElementById('diagram').title = button.textContent + ' diagram';
  document.getElementById('open').href = file;
  document.getElementById('context').textContent = descriptions[file];
 });
}
</script>
</body>
</html>
