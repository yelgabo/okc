<svg id="work-assignment-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 670" width="1320" height="670" role="img" aria-labelledby="schedule-title schedule-desc"><title id="schedule-title">What changes inside the larger-load engine</title><desc id="schedule-desc">Old mode47 owns whole phase-A units and dynamically claims phase-B units. The current WGS kernel uses cost-weighted stage ranges for both phases and combines partial units through fixup storage.</desc><style>#work-assignment-svg{background:#101013}#work-assignment-svg text{font-family:"Avenir Next",Avenir,system-ui,sans-serif;fill:#f0ece3}#work-assignment-svg .title{font-size:23px;font-weight:650}#work-assignment-svg .sub{font-size:18px;fill:#c0bcb6}#work-assignment-svg .gold{font-size:18px;fill:#dec18a}#work-assignment-svg .big{font-size:43px;font-weight:650}#work-assignment-svg .small{font-size:16px;fill:#c0bcb6}#work-assignment-svg .box{fill:#1b1b20;stroke:#686158;stroke-width:1.5}#work-assignment-svg .changed{fill:#202b24;stroke:#7eae92;stroke-width:1.8}#work-assignment-svg .store{fill:#1b1b20;stroke:#a38e68;stroke-width:1.5}#work-assignment-svg .cap{fill:#25252a;stroke:#a38e68;stroke-width:1.5}#work-assignment-svg .edge{stroke:#dec18a;stroke-width:2;fill:none;marker-end:url(#schedule-arrow)}</style><defs><marker id="schedule-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#dec18a"/></marker></defs><text x="30" y="43" class="title">T128 / T256 · the main difference is work ownership and packing</text><text x="30" y="100" class="gold">Older mode 47</text><text x="30" y="129" class="sub">4 warpgroups + 2 producer warps</text><rect x="30" y="155" width="390" height="92" rx="9" class="box"/><text x="48" y="187" class="title">Phase A</text><text x="48" y="219" class="sub">Whole units per CTA</text><path d="M420 201H464" class="edge"/><rect x="464" y="155" width="390" height="92" rx="9" class="box"/><text x="482" y="187" class="title">Phase B queue</text><text x="482" y="219" class="sub">Claim whole units at runtime</text><path d="M854 201H898" class="edge"/><rect x="898" y="155" width="390" height="92" rx="9" class="box"/><text x="916" y="187" class="title">Finish</text><text x="916" y="219" class="sub">Expert norm + combine</text><text x="30" y="320" class="gold">Current WGS / MAIN</text><text x="30" y="349" class="sub">Same 4 warpgroups + 2 producer warps</text><rect x="30" y="375" width="390" height="92" rx="9" class="box changed"/><text x="48" y="407" class="title">Cost prefix</text><text x="48" y="439" class="sub">A + B stage ranges per CTA</text><path d="M420 421H464" class="edge"/><rect x="464" y="375" width="390" height="92" rx="9" class="box changed"/><text x="482" y="407" class="title">Phase A → B</text><text x="482" y="439" class="sub">Readiness per dependency</text><path d="M854 421H898" class="edge"/><rect x="898" y="375" width="390" height="92" rx="9" class="box changed"/><text x="916" y="407" class="title">Fixup + finish</text><text x="916" y="439" class="sub">Combine split units; norm + sum</text><text x="30" y="525" class="title">Eligible WGS stage payload</text><text x="30" y="560" class="sub">Old: 32,768 B codes + 4,096 B scales = 36,864 B</text><text x="30" y="594" class="gold">New: 32,768 B codes + 3,072 B scales = 35,840 B</text><text x="30" y="631" class="small">Scales shrink 25%. Total packed stage shrinks 2.78%. This is a byte count, not a measured timing gain.</text></svg>