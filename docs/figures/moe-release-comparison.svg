<svg id="release-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 910" width="1320" height="910" role="img" aria-labelledby="release-title release-desc"><title id="release-title">Older public MoE versus the current standalone release</title><desc id="release-desc">T32 starts on the skinny kernel in the old recorded policy and the B4 four-warpgroup kernel in the current release. Green outlines mark changed dispatch and work assignment. This drawing does not encode internal timing.</desc><style>#release-svg{background:#101013}#release-svg text{font-family:"Avenir Next",Avenir,system-ui,sans-serif;fill:#f0ece3}#release-svg .title{font-size:23px;font-weight:650}#release-svg .sub{font-size:18px;fill:#c0bcb6}#release-svg .gold{font-size:18px;fill:#dec18a}#release-svg .big{font-size:43px;font-weight:650}#release-svg .small{font-size:16px;fill:#c0bcb6}#release-svg .box{fill:#1b1b20;stroke:#686158;stroke-width:1.5}#release-svg .changed{fill:#202b24;stroke:#7eae92;stroke-width:1.8}#release-svg .store{fill:#1b1b20;stroke:#a38e68;stroke-width:1.5}#release-svg .cap{fill:#25252a;stroke:#a38e68;stroke-width:1.5}#release-svg .edge{stroke:#dec18a;stroke-width:2;fill:none;marker-end:url(#release-arrow)}</style><defs><marker id="release-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#dec18a"/></marker></defs><text x="30" y="40" class="gold" id="selected-workload">T32 default view · change the token count above to inspect dispatch</text><rect x="24" y="65" width="614" height="805" rx="12" fill="#141417" stroke="#686158"/><text x="49" y="105" class="gold">OLDER PUBLIC ENTRY</text><text x="49" y="161" class="big">6,069.6 µs</text><text x="49" y="191" class="small">Aggregate score · 6 workloads</text><rect x="49" y="216" width="564" height="75" rx="9" class="box"/><text x="67" y="245" class="title" id="old-route">Recorded policy · T32</text><text x="67" y="272" class="sub" id="old-route-note">Preparation benchmark chose skinny</text><path d="M49 344A89.0 14 0 0 1 227 344V442A89.0 14 0 0 1 49 442Z" class="store"/><ellipse cx="138.0" cy="344" rx="89.0" ry="14" class="cap"/><text x="138.0" y="383" class="title" text-anchor="middle">Weights</text><text x="138.0" y="410" class="sub" id="old-codes" text-anchor="middle">NVFP4 codes</text><text x="138.0" y="434" class="sub" id="old-scale" text-anchor="middle">8-bit scales</text><rect x="287" y="332" width="333" height="160" rx="9" fill="#25252a" stroke="#a38e68"/><rect x="279" y="340" width="333" height="160" rx="9" fill="#25252a" stroke="#a38e68"/><rect x="271" y="348" width="333" height="160" rx="9" class="box"/><text x="291" y="382" class="title" id="old-compute">8 compute warps</text><text x="291" y="413" class="sub" id="old-threads">mma.sync · 288 threads / CTA</text><text x="291" y="443" class="sub" id="old-rings">3-slot weight ring</text><text x="291" y="477" class="gold" id="old-producer">One producer warp</text><path d="M227 395H271" class="edge"/><path d="M438 291V332" class="edge"/><path d="M49 544A89.0 14 0 0 1 227 544V642A89.0 14 0 0 1 49 642Z" class="store"/><ellipse cx="138.0" cy="544" rx="89.0" ry="14" class="cap"/><text x="138.0" y="583" class="title" text-anchor="middle">Activations</text><text x="138.0" y="610" class="sub" text-anchor="middle">BF16 rows</text><text x="138.0" y="634" class="sub" text-anchor="middle">Input or A result</text><path d="M227 593H250V488H271" class="edge"/><rect x="271" y="561" width="333" height="104" rx="9" class="box"/><text x="291" y="596" class="title" id="old-finalizer">Skinny finalizer</text><text x="291" y="627" class="sub">Expert RMS + routing-weight sum</text><path d="M438 508V561" class="edge"/><path d="M438 665V712" class="edge"/><text x="438" y="744" class="title" text-anchor="middle">BF16 MoE output</text><text x="49" y="802" class="sub">Phase A: gate/up → SiLU(gate) × up</text><text x="49" y="832" class="sub">Phase B: down → full expert RMS → combine</text><rect x="682" y="65" width="614" height="805" rx="12" fill="#141417" stroke="#7eae92"/><text x="707" y="105" class="gold">CURRENT STANDALONE RELEASE</text><text x="707" y="161" class="big">5,762.1 µs</text><text x="707" y="191" class="small">Aggregate score · 6 workloads</text><rect x="707" y="216" width="564" height="75" rx="9" class="box changed"/><text x="725" y="245" class="title" id="new-route">B4 / WGS · T32</text><text x="725" y="272" class="sub" id="new-route-note">Fixed token-size dispatch</text><path d="M707 344A89.0 14 0 0 1 885 344V442A89.0 14 0 0 1 707 442Z" class="store"/><ellipse cx="796.0" cy="344" rx="89.0" ry="14" class="cap"/><text x="796.0" y="383" class="title" text-anchor="middle">Weights</text><text x="796.0" y="410" class="sub" id="new-codes" text-anchor="middle">NVFP4 codes</text><text x="796.0" y="434" class="sub" id="new-scale" text-anchor="middle">SC6 if eligible</text><rect x="945" y="332" width="333" height="160" rx="9" fill="#25252a" stroke="#a38e68"/><rect x="937" y="340" width="333" height="160" rx="9" fill="#25252a" stroke="#a38e68"/><rect x="929" y="348" width="333" height="160" rx="9" class="box changed"/><text x="949" y="382" class="title" id="new-compute">4 compute warpgroups</text><text x="949" y="413" class="sub" id="new-threads">WGMMA · 576 threads / CTA</text><text x="949" y="443" class="sub" id="new-rings">3 weight + 3 activation slots</text><text x="949" y="477" class="gold" id="new-producer">Two producer warps</text><path d="M885 395H929" class="edge"/><path d="M1096 291V332" class="edge"/><path d="M707 544A89.0 14 0 0 1 885 544V642A89.0 14 0 0 1 707 642Z" class="store"/><ellipse cx="796.0" cy="544" rx="89.0" ry="14" class="cap"/><text x="796.0" y="583" class="title" text-anchor="middle">Activations</text><text x="796.0" y="610" class="sub" text-anchor="middle">BF16 rows</text><text x="796.0" y="634" class="sub" text-anchor="middle">Input or A result</text><path d="M885 593H908V488H929" class="edge"/><rect x="929" y="561" width="333" height="104" rx="9" class="box changed"/><text x="949" y="596" class="title" id="new-finalizer">B4 finalizer</text><text x="949" y="627" class="sub">Expert RMS + routing-weight sum</text><path d="M1096 508V561" class="edge"/><path d="M1096 665V712" class="edge"/><text x="1096" y="744" class="title" text-anchor="middle">BF16 MoE output</text><text x="707" y="802" class="sub">Phase A: gate/up → SiLU(gate) × up</text><text x="707" y="832" class="sub">Phase B: down → full expert RMS → combine</text><text x="30" y="897" class="small">Same MoE math. Different dispatcher and implementation. Box sizes do not represent elapsed time.</text></svg>